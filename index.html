<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Spooky Diner Rush</title>
<meta name="theme-color" content="#2B1B17" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/png" href="./icons/icon-192.png" />
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<style>
  @font-face { font-family: Fredoka; font-weight: 400; font-style: normal; font-display: block; src: url(./assets/fonts/fredoka-400.woff2) format('woff2'); }
  @font-face { font-family: Fredoka; font-weight: 600; font-style: normal; font-display: block; src: url(./assets/fonts/fredoka-600.woff2) format('woff2'); }
  @font-face { font-family: Fredoka; font-weight: 700; font-style: normal; font-display: block; src: url(./assets/fonts/fredoka-700.woff2) format('woff2'); }
  html, body { margin: 0; height: 100%; background: #2B1B17; overflow: hidden; touch-action: none; }
  html, body, #game, canvas { -webkit-tap-highlight-color: transparent; outline: none; }
  body { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #game { width: 100vw; height: 100vh; }
  #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #2B1B17; color: #FFF4DC;
    font: 600 24px/1.3 Fredoka, "Baloo 2", system-ui, sans-serif; text-align: center;
    align-items: center; justify-content: center; flex-direction: column; gap: 16px; padding: 24px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #rotate #rotateMsg { background: #F28C28; color: #2B1B17; border-radius: 16px; padding: 12px 24px; }
  #rotate .phone { width: 56px; height: 96px; border: 5px solid #F28C28; border-radius: 12px; animation: turn 1.8s ease-in-out infinite; }
  @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (prefers-reduced-motion: reduce) { #rotate .phone { animation: none; transform: rotate(-90deg); } }
  @media (max-width: 899px) and (orientation: portrait) { #rotate { display: flex; } }
</style>
</head>
<body>
<div id="game"></div>
<div id="rotate" role="button" tabindex="0"><div class="phone"></div><div id="rotateMsg">Turn your phone sideways to play</div></div>
<link rel="preload" as="font" type="font/woff2" crossorigin href="./assets/fonts/fredoka-400.woff2" />
<script type="module" src="/src/main.ts"></script>
</body>
</html>
