name: Verify Chef Rush

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        if: always()
      - run: npm run build:crazygames
        if: always()
